name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard
        2. ...
  - type: input
    id: version
    attributes:
      label: Peek version
      placeholder: "0.1.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Logs are in %LOCALAPPDATA%\io.github.highskai.peek\logs. Remove anything private before pasting.
      render: text
