name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # The section of CHANGELOG.md for this version goes at the top of the release.
      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($text, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<PEEK_NOTES_EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value "PEEK_NOTES_EOF"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Peek v__VERSION__
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ## Install

            Download the **`x64-setup.exe`** installer below and run it. No admin rights needed.
            Prefer an MSI? Use the `.msi` file instead.

            Windows may show a SmartScreen prompt because the installer isn't code-signed yet:
            choose **More info → Run anyway**.

            See the [README](https://github.com/${{ github.repository }}#readme) for features and setup.
          releaseDraft: false
          prerelease: false
