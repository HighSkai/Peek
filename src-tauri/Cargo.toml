[package]
name = "peek"
version = "0.3.1"
description = "A Dynamic Island for Windows 11"
authors = ["Peek contributors"]
license = "MIT"
repository = "https://github.com/HighSkai/Peek"
edition = "2021"
rust-version = "1.80"

[lib]
name = "peek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "native-tls", "charset", "http2", "system-proxy"] }
futures-util = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component"] }
base64 = "0.22"
urlencoding = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
wmi = "0.18"
nvml-wrapper = "0.13"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
